# Netlify-Einstellungen · KG „Bleibach" Frauenberg 1972 e.V.
# Wird nur bei einem Deploy per Git oder Netlify-CLI gelesen (dort läuft auch die Speicherfunktion des Editors).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Hinweisdatei für Claude nicht öffentlich ausliefern
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true
